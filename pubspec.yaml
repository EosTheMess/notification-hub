name: notification_hub
description: "Unified Notification Hub - Cross-platform notification aggregator with Neon Rush aesthetic"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.5.0

  # Networking & Discovery
  bonsoir: ^5.1.11         # mDNS/Bonjour service discovery (updated)
  web_socket_channel: ^2.4.5
  http: ^1.2.1

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Platform Channels & Permissions
  dbus: ^0.7.12          # Linux D-Bus notification listener

  # UI & Animation
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true